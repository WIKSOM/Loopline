<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Loopline Lite</title>
<!--
  Loopline Lite - a tiny, fully independent fallback.

  This file has ZERO dependency on Loopline.html: no shared code, no shared
  DOM, nothing. It's a separate, deliberately minimal page that talks to
  the same Firebase project and the same `maintenanceChat/messages` path
  the main app's Update Mode overlay uses - so it's useful two ways:

  1. As a place to test things (like notifications) in isolation, without
     the complexity of the full app getting in the way.
  2. As a fallback that still works even if Loopline.html itself is broken,
     mid-edit, or down for some other reason - the same way a project's
     README on GitHub is still readable even when the actual site isn't up.

  Keep it this way: no new dependencies, no shared files with the main app.
  The moment this needs something from Loopline.html to work, it stops
  being a reliable fallback for Loopline.html.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1c1422, #100c15 70%);
    color: #f3ecf7;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .sub { font-size: 11.5px; color: #b8a9c9; margin-top: 2px; }
  #status-pill {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
    color: #b8a9c9;
    flex-shrink: 0;
  }
  #status-pill.live { color: #7ee0c3; border-color: rgba(126,224,195,0.4); }
  #status-pill.updating { color: #ffcf86; border-color: rgba(255,207,134,0.4); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 16px;
    min-height: 0;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 2px;
  }
  .msg { font-size: 13.5px; line-height: 1.4; }
  .msg b { color: #7ee0c3; margin-right: 6px; }
  .msg .time { font-size: 10px; color: #85748f; margin-left: 6px; }
  .empty { text-align: center; color: #85748f; font-size: 12.5px; margin-top: 20px; }
  form { display: flex; gap: 8px; margin-top: 8px; flex-shrink: 0; }
  form[hidden] { display: none; }
  input {
    flex: 1;
    background: #17111d;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px 12px;
    color: #f3ecf7;
    font-size: 14px;
    outline: none;
  }
  input:focus-visible { border-color: #7ee0c3; }
  button {
    background: #7ee0c3;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 13.5px;
    font-weight: 700;
    color: #12261f;
    cursor: pointer;
  }
  button.secondary {
    background: rgba(255,255,255,0.08);
    color: #f3ecf7;
  }
  .test-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 16px 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  .test-row button { flex: 1; min-width: 140px; }
  #test-log { font-size: 11px; color: #85748f; padding: 0 16px 12px; max-width: 560px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>

<header>
  <div>
    <h1>💬 Loopline Lite</h1>
    <div class="sub">Minimal fallback chat &amp; test page</div>
  </div>
  <span id="status-pill">Checking main site…</span>
</header>

<main>
  <div id="messages"></div>
  <form id="name-form">
    <input id="name-input" placeholder="What's your name?" maxlength="18" autocomplete="off" />
    <button type="submit">Join</button>
  </form>
  <form id="send-form" hidden>
    <input id="send-input" placeholder="Type a message…" maxlength="500" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</main>

<div class="test-row">
  <button type="button" class="secondary" id="test-notif-btn">🔔 Test notification</button>
  <button type="button" class="secondary" id="test-sound-btn">🔊 Test sound</button>
</div>
<div id="test-log"></div>

<!-- Firebase (compat SDK - same as the main app, so this reads/writes the
     exact same project without needing any build step). -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function () {
  // Same project as Loopline.html. Intentionally hardcoded here rather
  // than loaded from a shared file, so this page has no file dependency
  // on the main app at all - copy this one file anywhere and it works.
  const firebaseConfig = {
    apiKey: "AIzaSyACE7dNGZf0ObhFb6cWSPSWrDvERPzpekI",
    authDomain: "group-chat-5bea9.firebaseapp.com",
    databaseURL: "https://group-chat-5bea9-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "group-chat-5bea9",
    storageBucket: "group-chat-5bea9.firebasestorage.app",
    messagingSenderId: "576301498952",
    appId: "1:576301498952:web:91b543cab5cb356ca58e7d",
    measurementId: "G-VQV8V6MT6Z"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const chatRef = db.ref('maintenanceChat/messages');
  const statusRef = db.ref('siteStatus');
  const NAME_KEY = 'gc:liteChatName'; // same key Loopline.html's Update Mode overlay uses

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const statusPill = document.getElementById('status-pill');
  statusRef.on('value', (snap) => {
    const val = snap.val() || {};
    if (val.shutdown) {
      statusPill.textContent = 'Main site: shut down';
      statusPill.className = 'updating';
    } else if (val.updateMode) {
      statusPill.textContent = 'Main site: update mode';
      statusPill.className = 'updating';
    } else {
      statusPill.textContent = 'Main site: live';
      statusPill.className = 'live';
    }
  }, () => {
    statusPill.textContent = 'Main site: unknown (offline?)';
  });

  const messagesEl = document.getElementById('messages');
  const nameForm = document.getElementById('name-form');
  const nameInput = document.getElementById('name-input');
  const sendForm = document.getElementById('send-form');
  const sendInput = document.getElementById('send-input');
  let myName = null;

  try {
    const saved = localStorage.getItem(NAME_KEY);
    if (saved) {
      myName = saved;
      nameForm.hidden = true;
      sendForm.hidden = false;
    }
  } catch (e) {}

  chatRef.limitToLast(200).on('value', (snap) => {
    const val = snap.val() || {};
    const entries = Object.values(val).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    if (!entries.length) {
      messagesEl.innerHTML = '<p class="empty">No messages yet - say hi!</p>';
      return;
    }
    messagesEl.innerHTML = entries.map(m => `
      <div class="msg"><b>${escapeHtml(m.name || '?')}</b>${escapeHtml(m.text || '')}<span class="time">${new Date(m.ts || 0).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
    `).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, (err) => {
    messagesEl.innerHTML = '<p class="empty">Could not connect. Check your internet connection.</p>';
    console.error(err);
  });

  nameForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = nameInput.value.trim().slice(0, 18);
    if (!name) return;
    myName = name;
    try { localStorage.setItem(NAME_KEY, name); } catch (err) {}
    nameForm.hidden = true;
    sendForm.hidden = false;
    sendInput.focus();
  });

  sendForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = sendInput.value.trim().slice(0, 500);
    if (!text || !myName) return;
    sendInput.value = '';
    chatRef.push({ name: myName, text, ts: Date.now() }).catch((err) => console.error(err));
  });

  // ---- Test tools ----
  // The whole reason this page exists as a separate thing worth having:
  // a place to check notification/sound behavior on a device without the
  // full app's complexity in the way.
  const testLog = document.getElementById('test-log');
  function log(msg) { testLog.textContent = msg; }

  function playTestPing() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
      return true;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  document.getElementById('test-sound-btn').addEventListener('click', () => {
    const ok = playTestPing();
    log(ok ? 'Played a test tone.' : 'Could not play sound - see console for the error.');
  });

  document.getElementById('test-notif-btn').addEventListener('click', async () => {
    if (!('Notification' in window)) {
      log('This browser does not support the Notification API at all.');
      return;
    }
    let permission = Notification.permission;
    if (permission === 'default') {
      permission = await Notification.requestPermission();
    }
    if (permission !== 'granted') {
      log('Notification permission is "' + permission + '" - allow notifications for this site to test further.');
      return;
    }
    try {
      const n = new Notification('Loopline Lite test', { body: 'If you can see this, notifications are working on this device/browser.' });
      n.onclick = () => window.focus();
      playTestPing();
      log('Notification sent - check for a system pop-up. Some mobile browsers only show these when the tab is in the background.');
    } catch (e) {
      console.error(e);
      log('The direct Notification constructor was blocked (common on mobile Chrome). That specific path needs a service worker, which this standalone test page does not set up - this is exactly the kind of thing worth confirming here before assuming it is a bug in the main app.');
    }
  });
})();
</script>
</body>
</html>
